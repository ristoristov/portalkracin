<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Наставнички панел | Училишен портал</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px 0;

        .container {
            max-width: 950px;

        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        h2 {
            color: #1e3a8a;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {

        .add-button,

            color: white;
        }

        .edit-button {
            background: #f59e0b;
            color: white;
            margin-right: 8px;
        }

        .delete-button {
            background: #dc2626;
            color: white;
        }

        .cancel-button {
            background: #6b7280;
            color: white;
            margin-left: 8px;
        }

        .logout-button {
            background: #dc2626;
            color: white;
        }

        .hidden {

        .message {

            padding: 12px;
            border-radius: 8px;

        }

            border: 1px solid #ddd;

            border-radius: 10px;

        .task h3 {
            color: #1e3a8a;
            margin-top: 0;
        }

        .task-info {

        }

        .task-buttons {
            margin-top: 10px;
        }

        .edit-box {
            margin-top: 15px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 10px;
            border: 1px solid #ddd;
        }
    </style>
</head>

<body>

<header>

<div class="container">

    <!-- НАЈАВА -->

        </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>

    // ======================================
    // SUPABASE
    // ======================================

    const SUPABASE_URL =
        "https://mxwunraqqhqmrxhjatvi.supabase.co";

    // ОВДЕ ОСТАВИ ЈА ТВОЈАТА ПОСТОЕЧКА
    // SUPABASE PUBLISHABLE KEY
    const SUPABASE_KEY =
        "sb_publishable_YDzpfdflmhyFdaeryqZe2g_SRdOnyam";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ======================================
    // ПРОВЕРКА НА НАСТАВНИЧКА УЛОГА
    // ======================================

    async function checkTeacherRole() {

        const {
            data: { user }
        } = await supabaseClient.auth.getUser();

        if (!user) {
            return false;
        }

        const { data, error } =
            await supabaseClient
                .from("profiles")
                .select("role")
                .eq("id", user.id)
                .single();

        if (error || !data || data.role !== "teacher") {
            return false;
        }

        return true;
    }


    // ======================================
    // НАЈАВА
    // ======================================

    async function login() {

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("loginMessage");


        const { error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });


        if (error) {

            message.classList.remove("hidden");

            message.textContent =
                "❌ Погрешен e-mail или лозинка.";

            return;
        }


        const isTeacher =
            await checkTeacherRole();


        if (!isTeacher) {

            await supabaseClient.auth.signOut();

            message.classList.remove("hidden");

            message.textContent =
                "❌ Оваа сметка нема наставничка дозвола.";

            return;
        }


        document
            .getElementById("loginBox")
            .classList.add("hidden");


        document
            .getElementById("teacherPanel")
            .classList.remove("hidden");


        loadTasks();
        loadMaterials();
    }


    // ======================================
    // ОДЈАВА
    // ======================================

    async function logout() {

        await supabaseClient.auth.signOut();


        document
            .getElementById("teacherPanel")
            .classList.add("hidden");


        document
            .getElementById("loginBox")
            .classList.remove("hidden");
    }


    // ======================================
    // ДОДАВАЊЕ ДОМАШНА ЗАДАЧА
    // ======================================

    async function addTask() {

        const grade =
            document.getElementById("grade").value;

        const subject =
            document.getElementById("subject").value;

        const title =
            document.getElementById("title").value.trim();

        const description =
            document.getElementById("description").value.trim();

        const date =
            document.getElementById("date").value;

        const deadline =
            document.getElementById("deadline").value;

        const message =
            document.getElementById("addMessage");


        if (!title || !description || !date || !deadline) {

            message.classList.remove("hidden");

            message.textContent =
                "⚠️ Пополнете ги сите полиња.";

            return;
        }


        const { error } =
            await supabaseClient
                .from("domasni_zadaci")
                .insert([{
                    naslov: title,
                    opis: description,
                    predmet: subject,
                    oddelenie: grade,
                    datum: date,
                    rok: deadline
                }]);


        if (error) {

            console.error(error);

            message.classList.remove("hidden");

            message.textContent =
                "❌ Не успеа додавањето на задачата.";

            return;
        }


        message.classList.remove("hidden");

        message.textContent =
            "✅ Домашната задача е успешно додадена!";


        document.getElementById("title").value = "";
        document.getElementById("description").value = "";
        document.getElementById("date").value = "";
        document.getElementById("deadline").value = "";


        loadTasks();
    }


    // ======================================
    // ДОДАВАЊЕ НАСТАВЕН МАТЕРИЈАЛ
    // ======================================

    async function addMaterial() {

    const oddelenie =
        document.getElementById("materialOddelenie").value;

    const predmet =
        document.getElementById("materialPredmet").value;

    const naslov =
        document.getElementById("materialNaslov").value.trim();

    const opis =
        document.getElementById("materialOpis").value.trim();

    const tip =
        document.getElementById("materialTip").value;

    const urlInput =
        document.getElementById("materialUrl");

    const fileInput =
        document.getElementById("materialFile");

    const message =
        document.getElementById("materialMessage");


    const file =
        fileInput.files[0];


    // Мора да има или линк или датотека
    if (!naslov || (!urlInput.value.trim() && !file)) {

        message.textContent =
            "❌ Внеси наслов и линк или прикачи датотека.";

        return;
    }


    message.textContent =
        "⏳ Материјалот се додава...";


    let finalUrl =
        urlInput.value.trim();


    // ==========================================
    // АКО Е ИЗБРАНА ДАТОТЕКА
    // ==========================================

    if (file) {

        const fileName =
            Date.now() + "_" + file.name;

        const filePath =
            "materijali/" + fileName;


        const { error: uploadError } =
            await supabaseClient
                .storage
                .from("nastavni-materijali")
                .upload(filePath, file);


        if (uploadError) {

            console.error(uploadError);

            message.textContent =
                "❌ Грешка при прикачување на датотеката.";

            return;
        }


        // Бидејќи bucket-от е Private,
        // ќе користиме потписан линк
        const { data: signedData, error: signedError } =
            await supabaseClient
                .storage
                .from("nastavni-materijali")
                .createSignedUrl(filePath, 60 * 60 * 24 * 30);


        if (signedError) {

            console.error(signedError);

            message.textContent =
                "❌ Датотеката е прикачена, но не можев да креирам линк.";

            return;
        }


        finalUrl =
            signedData.signedUrl;
    }


    // ==========================================
    // ЗАПИШУВАЊЕ ВО ТАБЕЛАТА
    // ==========================================

    const { error } =
        await supabaseClient
            .from("materijali")
            .insert([{
                naslov: naslov,
                opis: opis,
                predmet: predmet,
                oddelenie: oddelenie,
                tip: tip,
                url: finalUrl
            }]);


    if (error) {

        console.error(error);

        message.textContent =
            "❌ Грешка при додавање на материјал.";

        return;
    }


    message.textContent =
        "✅ Материјалот е успешно додаден.";


    document.getElementById("materialNaslov").value = "";
    document.getElementById("materialOpis").value = "";
    document.getElementById("materialUrl").value = "";
    document.getElementById("materialFile").value = "";


    loadMaterials();

}


    // ======================================
    // ПРИКАЖУВАЊЕ НА МАТЕРИЈАЛИ
    // ======================================

    async function loadMaterials() {

    const list =
        document.getElementById("materialsList");


    const { data, error } =
        await supabaseClient
            .from("materijali")
            .select("*")
            .order("datum", {
                ascending: false
            });


    if (error) {

        console.error(error);

        list.innerHTML =
            "<p>❌ Не може да се вчитаат материјалите.</p>";

        return;
    }


    if (!data || data.length === 0) {

        list.innerHTML =
            "<p>Нема додадени материјали.</p>";

        return;
    }


    list.innerHTML = "";


    data.forEach(material => {

        const div =
            document.createElement("div");


        div.style.border =
            "1px solid #ddd";

        div.style.padding =
            "15px";

        div.style.marginBottom =
            "10px";

        div.style.borderRadius =
            "8px";


        const title =
            document.createElement("strong");

        title.textContent =
            material.naslov;


        const info =
            document.createElement("p");

        info.textContent =
            material.oddelenie +
            " – " +
            material.predmet;


        const description =
            document.createElement("p");

        description.textContent =
            material.opis || "";


        const type =
            document.createElement("small");

        type.textContent =
            material.tip;


        const link =
            document.createElement("a");

        link.href =
            material.url;

        link.target =
            "_blank";

        link.rel =
            "noopener noreferrer";

        link.textContent =
            "🔗 Отвори материјал";


        // ==========================================
        // КОПЧЕ ЗА БРИШЕЊЕ
        // ==========================================

        const deleteButton =
            document.createElement("button");

        deleteButton.textContent =
            "🗑️ Избриши";

        deleteButton.style.marginLeft =
            "10px";

        deleteButton.style.padding =
            "8px 12px";

        deleteButton.style.background =
            "#dc2626";

        deleteButton.style.color =
            "white";

        deleteButton.style.border =
            "none";

        deleteButton.style.borderRadius =
            "6px";

        deleteButton.style.cursor =
            "pointer";


        deleteButton.onclick =
            () => deleteMaterial(material);


        div.appendChild(title);
        div.appendChild(info);
        div.appendChild(description);
        div.appendChild(type);

        div.appendChild(document.createElement("br"));
        div.appendChild(document.createElement("br"));

        div.appendChild(link);
        div.appendChild(deleteButton);


        list.appendChild(div);
    });
}


    // ======================================
    // ПРИКАЖУВАЊЕ НА ДОМАШНИ ЗАДАЧИ
    // ======================================

    async function loadTasks() {

        const taskList =
            document.getElementById("taskList");


        const { data, error } =
            await supabaseClient
                .from("domasni_zadaci")
                .select("*")
                .order("rok", {
                    ascending: true
                });


        if (error) {

            console.error(error);

            taskList.textContent =
                "❌ Не може да се вчитаат задачите.";

            return;
        }


        if (!data || data.length === 0) {

            taskList.textContent =
                "Нема внесени задачи.";

            return;
        }


        taskList.innerHTML = "";


        data.forEach(task => {

            const div =
                document.createElement("div");

            div.className =
                "task";


            const title =
                document.createElement("h3");

            title.textContent =
                task.naslov;


            const description =
                document.createElement("p");

            description.textContent =
                task.opis;


            const info =
                document.createElement("p");

            info.className =
                "task-info";

            info.textContent =
                "📚 " +
                task.oddelenie +
                " | " +
                task.predmet +
                " | 📅 " +
                task.datum +
                " | ⏰ Рок: " +
                task.rok;


            const buttons =
                document.createElement("div");

            buttons.className =
                "task-buttons";


            const editButton =
                document.createElement("button");

            editButton.className =
                "edit-button";

            editButton.textContent =
                "✏️ Измени";

            editButton.onclick =
                function() {
                    showEditForm(task);
                };


            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "delete-button";

            deleteButton.textContent =
                "🗑️ Избриши";

            deleteButton.onclick =
                function() {
                    deleteTask(task.id);
                };


            buttons.appendChild(editButton);
            buttons.appendChild(deleteButton);


            div.appendChild(title);
            div.appendChild(description);
            div.appendChild(info);
            div.appendChild(buttons);


            taskList.appendChild(div);
        });
    }


    // ======================================
    // ФОРМА ЗА ИЗМЕНА
    // ======================================

        const taskList =
            document.getElementById("taskList");


        const editBox =
            document.createElement("div");

        editBox.className =
            "edit-box";


        editBox.innerHTML = `

            <h3>✏️ Измени задача</h3>

            <label>Одделение</label>

            <select id="editGrade">
                <option value="VI">VI одделение</option>
                <option value="VII">VII одделение</option>
                <option value="VIII">VIII одделение</option>
                <option value="IX">IX одделение</option>
            </select>

            <label>Предмет</label>

            <select id="editSubject">
                <option value="Математика">Математика</option>
                <option value="Информатика">Информатика</option>
                <option value="Физика">Физика</option>
                <option value="Техничко образование">
                    Техничко образование
                </option>
            </select>

            <label>Наслов</label>

            <input
                type="text"
                id="editTitle"
            >

            <label>Опис</label>

            <textarea
                id="editDescription"
            ></textarea>

            <label>Датум</label>

            <input
                type="date"
                id="editDate"
            >

            <label>Рок</label>

            <input
                type="date"
                id="editDeadline"
            >

            <button
                class="save-button"
                onclick="saveEdit(${task.id})"
            >
                💾 Зачувај промени
            </button>

            >
                Откажи
            </button>
        `;


        editBox.querySelector("#editGrade").value =
            task.oddelenie;

        editBox.querySelector("#editSubject").value =
            task.predmet;

        editBox.querySelector("#editTitle").value =
            task.naslov;

        editBox.querySelector("#editDescription").value =
            task.opis;

        editBox.querySelector("#editDate").value =
            task.datum;

        editBox.querySelector("#editDeadline").value =
            task.rok;


        taskList.innerHTML = "";

        taskList.appendChild(editBox);
    }


    // ======================================
    // ЗАЧУВАЈ ИЗМЕНИ
    // ======================================

    async function saveEdit(id) {

        const grade =
            document.getElementById("editGrade").value;

        const subject =
            document.getElementById("editSubject").value;

        const title =
            document.getElementById("editTitle").value.trim();

        const description =
            document.getElementById("editDescription").value.trim();

        const date =
            document.getElementById("editDate").value;

        const deadline =
            document.getElementById("editDeadline").value;


        if (!title || !description || !date || !deadline) {

            alert("⚠️ Пополнете ги сите полиња.");

            return;
        }


        const { error } =
            await supabaseClient
                .from("domasni_zadaci")
                .update({
                    naslov: title,
                    opis: description,
                    predmet: subject,
                    oddelenie: grade,
                    datum: date,
                    rok: deadline
                })
                .eq("id", id);


        if (error) {

            console.error(error);

            alert(
                "❌ Не успеа изменувањето на задачата."
            );

            return;
        }


        alert(
            "✅ Задачата е успешно изменета!"
        );


        loadTasks();
    }


    // ======================================
    // БРИШЕЊЕ ДОМАШНА ЗАДАЧА
    // ======================================

    async function deleteTask(id) {

        const confirmed =
            confirm(
                "Дали навистина сакате да ја избришете оваа домашна задача?"
            );


        if (!confirmed) {
            return;
        }


        const { error } =
            await supabaseClient
                .from("domasni_zadaci")
                .delete()
                .eq("id", id);


        if (error) {

            console.error(error);

            alert(
                "❌ Не успеа бришењето на задачата."
            );

            return;
        }


        alert(
            "🗑️ Задачата е избришана."
        );


        loadTasks();
    }


    // ======================================
    // ПРОВЕРКА НА ПОСТОЕЧКА СЕСИЈА
    // ======================================

    async function checkExistingSession() {

        const {
            data: { session }
        } = await supabaseClient.auth.getSession();


        if (!session) {
            return;
        }


        const isTeacher =
            await checkTeacherRole();


        if (isTeacher) {

            document
                .getElementById("loginBox")
                .classList.add("hidden");


            document
                .getElementById("teacherPanel")
                .classList.remove("hidden");


            loadTasks();
            loadMaterials();

        } else {

            await supabaseClient.auth.signOut();
        }
    }


    // ======================================
    // СТАРТ
    // ======================================

    checkExistingSession();


</script>
