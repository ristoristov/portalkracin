<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Наставнички панел | Училишен портал</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px 0;
        }

        .container {
            max-width: 950px;
            margin: 30px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        h2 {
            color: #1e3a8a;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 7px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            opacity: 0.9;
        }

        .login-button,
        .add-button,
        .save-button {
            background: #2563eb;
            color: white;
        }

        .edit-button {
            background: #f59e0b;
            color: white;
            margin-right: 8px;
        }

        .delete-button {
            background: #dc2626;
            color: white;
        }

        .cancel-button {
            background: #6b7280;
            color: white;
            margin-left: 8px;
        }

        .logout-button {
            background: #dc2626;
            color: white;
        }

        .hidden {
            display: none;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #eef2ff;
        }

        .task {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .task h3 {
            color: #1e3a8a;
            margin-top: 0;
        }

        .task-info {
            color: #555;
            margin-top: 12px;
        }

        .task-buttons {
            margin-top: 10px;
        }

        .edit-box {
            margin-top: 15px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 10px;
            border: 1px solid #ddd;
        }
    </style>
</head>

<body>

<header>
    <h1>👨‍🏫 Наставнички панел</h1>
    <p>Училишен портал</p>
</header>

<div class="container">

    <!-- НАЈАВА -->

    <div id="loginBox" class="box">

        <h2>🔐 Најава</h2>

        <label for="email">E-mail</label>

        <input
            type="email"
            id="email"
            placeholder="Внесете e-mail"
        >

        <label for="password">Лозинка</label>

        <input
            type="password"
            id="password"
            placeholder="Внесете лозинка"
        >

        <button
            class="login-button"
            onclick="login()"
        >
            НАЈАВИ СЕ
        </button>

        <div
            id="loginMessage"
            class="message hidden"
        ></div>

    </div>


    <!-- НАСТАВНИЧКИ ПАНЕЛ -->

    <div id="teacherPanel" class="hidden">

        <!-- ДОДАВАЊЕ -->

        <div class="box">

            <h2>➕ Додај домашна задача</h2>

            <label for="grade">Одделение</label>

            <select id="grade">
                <option value="VI">VI одделение</option>
                <option value="VII">VII одделение</option>
                <option value="VIII">VIII одделение</option>
                <option value="IX">IX одделение</option>
            </select>

            <label for="subject">Предмет</label>

            <select id="subject">
                <option value="Математика">Математика</option>
                <option value="Информатика">Информатика</option>
                <option value="Физика">Физика</option>
                <option value="Техничко образование">
                    Техничко образование
                </option>
            </select>

            <label for="title">Наслов</label>

            <input
                type="text"
                id="title"
                placeholder="Пример: Линеарни равенки"
            >

            <label for="description">Опис на задачата</label>

            <textarea
                id="description"
                placeholder="Внесете ја домашната задача..."
            ></textarea>

            <label for="date">Датум</label>

            <input
                type="date"
                id="date"
            >

            <label for="deadline">Рок</label>

            <input
                type="date"
                id="deadline"
            >

            <button
                class="add-button"
                onclick="addTask()"
            >
                ➕ ДОДАЈ ДОМАШНА ЗАДАЧА
            </button>

            <div
                id="addMessage"
                class="message hidden"
            ></div>

        </div>


        <!-- ПОСТОЕЧКИ ЗАДАЧИ -->

        <div class="box">

            <h2>📚 Веќе внесени задачи</h2>

            <div id="taskList">
                Се вчитуваат задачите...
            </div>

        </div>


        <!-- ОДЈАВА -->

        <div class="box">

            <button
                class="logout-button"
                onclick="logout()"
            >
                🚪 ОДЈАВИ СЕ
            </button>

        </div>

    </div>

</div>


<script>

    // ======================================
    // SUPABASE
    // ======================================

    const SUPABASE_URL =
        "https://mxwunraqqhqmrxhjatvi.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_YDzpfdflmhyFdaeryqZe2g_SRdOnyam";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ======================================
    // НАЈАВА
    // ======================================

    async function login() {

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("loginMessage");


        const { error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });


        if (error) {

            message.classList.remove("hidden");

            message.textContent =
                "❌ Најавувањето не успеа. Проверете ги e-mail адресата и лозинката.";

            return;
        }


        message.classList.add("hidden");

        document
            .getElementById("loginBox")
            .classList.add("hidden");

        document
            .getElementById("teacherPanel")
            .classList.remove("hidden");


        loadTasks();
    }


    // ======================================
    // ОДЈАВА
    // ======================================

    async function logout() {

        await supabaseClient.auth.signOut();

        document
            .getElementById("teacherPanel")
            .classList.add("hidden");

        document
            .getElementById("loginBox")
            .classList.remove("hidden");
    }


    // ======================================
    // ДОДАВАЊЕ ЗАДАЧА
    // ======================================

    async function addTask() {

        const grade =
            document.getElementById("grade").value;

        const subject =
            document.getElementById("subject").value;

        const title =
            document.getElementById("title").value.trim();

        const description =
            document.getElementById("description").value.trim();

        const date =
            document.getElementById("date").value;

        const deadline =
            document.getElementById("deadline").value;

        const message =
            document.getElementById("addMessage");


        if (!title || !description || !date || !deadline) {

            message.classList.remove("hidden");

            message.textContent =
                "⚠️ Пополнете ги сите полиња.";

            return;
        }


        const { error } =
            await supabaseClient
                .from("domasni_zadaci")
                .insert([{
                    naslov: title,
                    opis: description,
                    predmet: subject,
                    oddelenie: grade,
                    datum: date,
                    rok: deadline
                }]);


        if (error) {

            console.error(error);

            message.classList.remove("hidden");

            message.textContent =
                "❌ Не успеа додавањето на задачата.";

            return;
        }


        message.classList.remove("hidden");

        message.textContent =
            "✅ Домашната задача е успешно додадена!";


        document.getElementById("title").value = "";
        document.getElementById("description").value = "";
        document.getElementById("date").value = "";
        document.getElementById("deadline").value = "";


        loadTasks();
    }


    // ======================================
    // ПРИКАЖУВАЊЕ НА ЗАДАЧИ
    // ======================================

    async function loadTasks() {

        const taskList =
            document.getElementById("taskList");


        const { data, error } =
            await supabaseClient
                .from("domasni_zadaci")
                .select("*")
                .order("rok", {
                    ascending: true
                });


        if (error) {

            console.error(error);

            taskList.textContent =
                "❌ Не може да се вчитаат задачите.";

            return;
        }


        if (!data || data.length === 0) {

            taskList.textContent =
                "Нема внесени задачи.";

            return;
        }


        taskList.innerHTML = "";


        data.forEach(task => {

            const div =
                document.createElement("div");

            div.className = "task";


            const title =
                document.createElement("h3");

            title.textContent =
                task.naslov;


            const description =
                document.createElement("p");

            description.textContent =
                task.opis;


            const info =
                document.createElement("p");

            info.className = "task-info";

            info.textContent =
                "📚 " +
                task.oddelenie +
                " | " +
                task.predmet +
                " | 📅 " +
                task.datum +
                " | ⏰ Рок: " +
                task.rok;


            const buttons =
                document.createElement("div");

            buttons.className =
                "task-buttons";


            // КОПЧЕ ИЗМЕНИ

            const editButton =
                document.createElement("button");

            editButton.className =
                "edit-button";

            editButton.textContent =
                "✏️ Измени";

            editButton.onclick =
                function() {
                    showEditForm(task);
                };


            // КОПЧЕ ИЗБРИШИ

            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "delete-button";

            deleteButton.textContent =
                "🗑️ Избриши";

            deleteButton.onclick =
                function() {
                    deleteTask(task.id);
                };


            buttons.appendChild(editButton);
            buttons.appendChild(deleteButton);


            div.appendChild(title);
            div.appendChild(description);
            div.appendChild(info);
            div.appendChild(buttons);


            taskList.appendChild(div);

        });

    }


    // ======================================
    // ФОРМА ЗА ИЗМЕНА
    // ======================================

    function showEditForm(task) {

        const taskList =
            document.getElementById("taskList");


        const editBox =
            document.createElement("div");

        editBox.className =
            "edit-box";


        editBox.innerHTML = `

            <h3>✏️ Измени задача</h3>

            <label>Одделение</label>

            <select id="editGrade">

                <option value="VI">VI одделение</option>

                <option value="VII">VII одделение</option>

                <option value="VIII">VIII одделение</option>

                <option value="IX">IX одделение</option>

            </select>


            <label>Предмет</label>

            <select id="editSubject">

                <option value="Математика">Математика</option>

                <option value="Информатика">Информатика</option>

                <option value="Физика">Физика</option>

                <option value="Техничко образование">
                    Техничко образование
                </option>

            </select>


            <label>Наслов</label>

            <input
                type="text"
                id="editTitle"
            >


            <label>Опис</label>

            <textarea
                id="editDescription"
            ></textarea>


            <label>Датум</label>

            <input
                type="date"
                id="editDate"
            >


            <label>Рок</label>

            <input
                type="date"
                id="editDeadline"
            >


            <button
                class="save-button"
                onclick="saveEdit(${task.id})"
            >
                💾 Зачувај промени
            </button>

            <button
                class="cancel-button"
                onclick="loadTasks()"
            >
                Откажи
            </button>
        `;


        editBox.querySelector("#editGrade").value =
            task.oddelenie;

        editBox.querySelector("#editSubject").value =
            task.predmet;

        editBox.querySelector("#editTitle").value =
            task.naslov;

        editBox.querySelector("#editDescription").value =
            task.opis;

        editBox.querySelector("#editDate").value =
            task.datum;

        editBox.querySelector("#editDeadline").value =
            task.rok;


        taskList.innerHTML = "";

        taskList.appendChild(editBox);
    }


    // ======================================
    // ЗАЧУВАЈ ИЗМЕНИ
    // ======================================

    async function saveEdit(id) {

        const grade =
            document.getElementById("editGrade").value;

        const subject =
            document.getElementById("editSubject").value;

        const title =
            document.getElementById("editTitle").value.trim();

        const description =
            document.getElementById("editDescription").value.trim();

        const date =
            document.getElementById("editDate").value;

        const deadline =
            document.getElementById("editDeadline").value;


        if (!title || !description || !date || !deadline) {

            alert("⚠️ Пополнете ги сите полиња.");

            return;
        }


        const { error } =
            await supabaseClient
                .from("domasni_zadaci")
                .update({
                    naslov: title,
                    opis: description,
                    predmet: subject,
                    oddelenie: grade,
                    datum: date,
                    rok: deadline
                })
                .eq("id", id);


        if (error) {

            console.error(error);

            alert(
                "❌ Не успеа изменувањето на задачата."
            );

            return;
        }


        alert(
            "✅ Задачата е успешно изменета!"
        );


        loadTasks();
    }


    // ======================================
    // БРИШЕЊЕ
    // ======================================

    async function deleteTask(id) {

        const confirmed =
            confirm(
                "Дали навистина сакате да ја избришете оваа домашна задача?"
            );


        if (!confirmed) {
            return;
        }


        const { error } =
            await supabaseClient
                .from("domasni_zadaci")
                .delete()
                .eq("id", id);


        if (error) {

            console.error(error);

            alert(
                "❌ Не успеа бришењето на задачата."
            );

            return;
        }


        alert(
            "🗑️ Задачата е избришана."
        );


        loadTasks();
    }

</script>

</body>
</html>
